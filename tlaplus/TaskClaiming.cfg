\* TaskClaiming.cfg — Small config for fast TLC checking
\*
\* Usage: java -jar tla2tools.jar -config TaskClaiming.cfg TaskClaiming.tla

SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    Workers = {w1, w2, w3}
    t1 = t1
    t2 = t2
    Tasks = {t1, t2}
    MaxFailures = 2

INVARIANTS
    TypeOK
    MutualExclusion
    NoDoubleExecution
    DLQOnlyAfterMaxFailures
    LockConsistency
    NoOrphanExecution

PROPERTIES
    TaskCompletion
    CrashRecovery
    NoStarvation
