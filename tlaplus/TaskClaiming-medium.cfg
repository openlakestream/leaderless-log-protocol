\* TaskClaiming-medium.cfg — Medium config for thorough TLC checking
\*
\* Usage: java -jar tla2tools.jar -config TaskClaiming-medium.cfg TaskClaiming.tla

SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    w4 = w4
    Workers = {w1, w2, w3, w4}
    t1 = t1
    t2 = t2
    t3 = t3
    Tasks = {t1, t2, t3}
    MaxFailures = 3

INVARIANTS
    TypeOK
    MutualExclusion
    NoDoubleExecution
    DLQOnlyAfterMaxFailures
    LockConsistency
    NoOrphanExecution

PROPERTIES
    TaskCompletion
    CrashRecovery
    NoStarvation
