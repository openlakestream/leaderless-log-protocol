\* LeaderlessLog-medium.cfg — Medium config for thorough TLC checking
\*
\* Usage: java -jar tla2tools.jar -config LeaderlessLog-medium.cfg LeaderlessLog.tla
\*
\* Sequential compaction: round 1 compacts [1,5], round 2 compacts [6,8].

SPECIFICATION Spec

CONSTANTS
    w1 = w1
    w2 = w2
    w3 = w3
    Writers = {w1, w2, w3}
    MaxOffset = 8
    CompactRangeStart = 1
    CompactRangeEnd = 5
    CompactRange2Start = 6
    CompactRange2End = 8
    MaxBatch = 3

INVARIANTS
    TypeOK
    MonotonicOffsets
    FencedRejectsAppends
    CompactionPreservesData
    NoPhantomEntries
    CursorConsistency
    NoOverlappingRanges
    NoReaderError
    SequentialCompactionSafety

PROPERTIES
    AppendProgress
    CompactionCompletes
    ReaderEventuallySucceeds
