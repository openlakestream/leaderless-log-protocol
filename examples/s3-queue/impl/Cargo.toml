[package]
name = "s3-queue"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s3q"
path = "src/main.rs"

[dependencies]
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
md5 = "0.7"

[features]
integration = []
